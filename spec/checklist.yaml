auth.08: "na: sem desativação/exclusão de conta implementada"   # Conta desativada/removida: o que acontece com sessões e dados?
auth.09: "sim MFA-R01, MFA-R02, MFA-R03, MFA-R04"   # Há MFA ou tokens de API? Como são emitidos e revogados?

