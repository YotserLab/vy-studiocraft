# --- pack auth: app com login, contas ou usuários identificados
auth.01: "sim CON-R01, CON-R02, CON-R05, CON-R08"   # Como o usuário se cadastra e autentica (e-mail/senha, SSO, magic link)?
auth.02: "sim CON-R10, CON-R11"   # Como funciona recuperação de senha/acesso e qual a validade do link?
auth.03: "sim CON-R08, CON-R12, NF06"   # Sessão: duração, renovação, logout e revogação (todos os dispositivos)?
auth.04: "sim CON-R04, PLA-R03, PLA-R04"   # Papéis e permissões: onde são definidos e como são verificados por recurso?
auth.05: "na: sem rate limit/bloqueio de login; mitigado por senha com hash e MFA opcional (gap registrado)"   # Proteção contra força bruta e bloqueio de conta?
auth.06: "na: verify-email marca email_verified (CON-R13) mas nada é bloqueado para não verificado"   # E-mail precisa ser verificado antes de usar? O que o usuário não verificado pode fazer?
