dominio: comparador
prefixo: CMP
resumo: "Comparação A/B de ganchos de 30 segundos via Gemini, com resultado salvo."
entidades:
  Comparacao: [titleA, hookA, visualCutsA, titleB, hookB, visualCutsB, niche, winner, edge, analise]
estados: "na: resultado pontual, sem ciclo de vida"
permissoes:
  criador: ["comparar", "salvar e consultar comparações"]
