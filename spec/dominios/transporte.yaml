dominio: transporte
prefixo: TRN
resumo: "Camada HTTP da API: sessão, upload, proxy RSS, SSE, fallback SPA e endpoints públicos."
entidades:
  Request: [method, path, sessao]
estados: "na: transporte sem estado"
permissoes:
  visitante: ["proxy render/gemini e mídia pública (TRN-R09)"]
  criador: ["rotas autenticadas de dados e arquivos"]
  admin: ["acesso total via PLA-R03"]
regras:
  TRN-R01: "Toda rota /api/v1/* de dados exige sessão válida; sem sessão retorna 401"
  TRN-R02: "Arquivos existem apenas sob usuarios/{uid}/; acesso ao próprio uid ou admin"
  TRN-R03: "Upload excedente a UPLOAD_MAX_MB (padrão 512MB) retorna 413"
  TRN-R04: "GET /api/feed faz proxy de URL http(s) arbitrária: timeout 8s, corpo máx 2MB, cache 5min"
  TRN-R05: "SSE /api/v1/fs/events exige permissão de leitura no path e envia keepalive a cada 25s"
  TRN-R06: "Sessão pode vir do cookie vysc_sess, header Bearer ou query ?token (usado pelo SSE)"
  TRN-R07: "Rota /api/* desconhecida retorna 404 JSON; rotas SPA desconhecidas servem index.html com 404"
  TRN-R08: "GET /api/feed e /feed exigem sessão válida; sem sessão retorna 401"
  TRN-R09: "Proxy /api/render, /api/rendered, /api/gemini/* e mídia de MEDIA_DIR não exigem sessão"
casos_de_uso:
  CU01: "Frontend assina mudanças em tempo real -> TRN-R05, TRN-R06"
  CU02: "Criador sobe arquivo grande -> TRN-R02, TRN-R03"
  CU03: "Visitante acessa mídia pública -> TRN-R09"
  CU04: "Criador consome feed RSS -> TRN-R08, TRN-R04"
bordas:
  - "feed com URL sem scheme http/https -> TRN-R04"
  - "request anônimo ao feed retorna 401 -> TRN-R08"
  - "acesso anônimo a /api/gemini/* consome cota da API key -> TRN-R09"
