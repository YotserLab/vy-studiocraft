dominio: playbook
prefixo: PLY
resumo: "Editorial playbook: retention rules extracted from 30s comparisons, organized by category."
entidades:
  Regra: [categoria, titulo, regra, impacto]
estados: "na: rule is editorial accumulation"
permissoes:
  criador: ["list and save rules in own playbook"]
  admin: ["full access via PLA-R03"]
regras:
  PLY-R01: "Each '[category] rule' line of a 30s comparison checklist becomes a playbook doc"
  PLY-R02: "A line without a '[category]' prefix is classified as 'retencao'"
  PLY-R03: "Saved rule stores titulo '<CATEGORY> — 30s Comparison (<niche>)' and impacto citing sides A and B"
  PLY-R04: "Rules live in usuarios/{uid}/playbook — isolated per user (PLA-R04)"
casos_de_uso:
  CU01: "Creator saves a comparison checklist to the playbook -> PLY-R01, PLY-R02, PLY-R03"
bordas:
  - "checklist line without category -> PLY-R02"
