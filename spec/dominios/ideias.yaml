dominio: ideias
prefixo: IDE
resumo: "Video idea bank fed by news, AI assistant and manual entry (/explorar)."
entidades:
  Ideia: [titulo, nicho, potencial, origem, notas]
estados: "na: idea is a free-form record, no lifecycle"
permissoes:
  criador: ["create, list and promote own ideas"]
  admin: ["full access via PLA-R03"]
regras:
  IDE-R01: "Idea records titulo, nicho, potencial, origem and notas"
  IDE-R02: "Ideas live in usuarios/{uid}/ideias — isolated per user (PLA-R04)"
  IDE-R03: "Converted news becomes an idea with titulo 'Pauta Notícia: <título>', origem 'Notícias RSS', potencial 'alto'"
  IDE-R04: "The AI assistant can create ideas via a conversation action (AssistantIdeaAction)"
  IDE-R05: "The /explorar screen is the user's ideas view"
casos_de_uso:
  CU01: "Creator turns news into an idea -> IDE-R03, IDE-R05"
bordas:
  - "news without title uses the parser's 'Sem título' -> IDE-R03, NOT-R02"
