# Answers: "sim ID[, ID]" (cites rule PED-R01, NF01 or P01) | "na: reason" | "?" (pending)

# --- pack base: always (every app)
base.01: "sim CON-R04, PLA-R03, PLA-R04"   # Who are the actors/roles and what can each one do?
base.02: "sim PRJ-R02, ROT-R06, REN-R01, DSH-R01"   # What is the main end-to-end flow (happy path)?
base.03: "sim PRJ-R08"   # Which entities have a lifecycle and which transitions are forbidden?
base.04: "sim CON-R02, CON-R03, PRJ-R01, RAD-R01, MID-R06, PUB-R01"   # Which data is required, unique or validated (format, limits)?
base.05: "sim CON-R05, TRN-R07, REN-R05, NOT-R06"   # What happens on failures (validation, network, external service) and what does the user see?
base.06: "sim PRJ-R09, MID-R04, CON-R11, CON-R12"   # Are there destructive operations? Logical or physical deletion, and is there confirmation?
base.07: "na: app does no monetary calculations; campaign valorAcordado is free text"   # Are there sensitive calculations or values (money, dates, rounding, currency)?
base.08: "sim CON-R01, RAD-R05, PUB-R06"   # How does first access / empty-data state behave?
base.09: "sim NF01, NF03, NF04, CON-R01"   # How is the app configured and deployed (variables, secrets, environments)?
base.10: "sim P02"   # What is the MVP done criterion (what must work to deliver)?

# --- pack auth: app with login, accounts or identified users
auth.01: "sim CON-R01, CON-R02, CON-R05, CON-R08"   # How does the user sign up and authenticate (e-mail/password, SSO, magic link)?
auth.02: "sim CON-R10, CON-R11"   # How does password/access recovery work and how long is the link valid?
auth.03: "sim CON-R08, CON-R12, NF06"   # Session: duration, renewal, logout and revocation (all devices)?
auth.04: "sim CON-R04, PLA-R03, PLA-R04"   # Roles and permissions: where are they defined and how are they checked per resource?
auth.05: "na: no rate limit/login lockout; mitigated by hashed password and optional MFA (recorded gap)"   # Protection against brute force and account lockout?
auth.06: "na: verify-email sets email_verified (CON-R13) but nothing is blocked for unverified users"   # Must e-mail be verified before use? What can an unverified user do?
auth.07: "na: no invite flow; signup closed by default (CON-R01)"   # Invites and onboarding: who invites, expiry, resend?
auth.08: "na: no account deactivation/deletion implemented"   # Deactivated/removed account: what happens to sessions and data?
auth.09: "sim MFA-R01, MFA-R02, MFA-R03, MFA-R04"   # Is there MFA or API tokens? How are they issued and revoked?

# --- pack api: backend exposes an API (REST/GraphQL) to clients
api.01: "na: single version /api/v1 with no formal compatibility policy"   # Versioning and breaking-change policy?
api.02: "sim TRN-R07, CON-R05"   # Standard error format (code, message, invalid fields) and HTTP codes?
api.03: "sim TRN-R01, PLA-R03, PLA-R04, TRN-R02"   # Authentication and scopes per endpoint?
api.04: "sim PLA-R11"   # Standardized pagination, filters and maximum limits?
api.05: "na: no rate limit; feed has 5min cache (NF02) and upload has a cap (NF03)"   # Rate limit and informative headers?
api.06: "na: no Idempotency-Key; doc creations generate a new id per call"   # Idempotency-Key on creation/payment operations?
api.07: "na: no OpenAPI; contract described in this spec and in the code"   # Documentation (OpenAPI) maintained alongside the code?

# --- pack dados: app that persists data
dados.01: "na: no optimistic lock/version on docs; PATCH overwrites fields (P02 mitigates)"   # Concurrent editing: how to avoid overwrite (version/optimistic lock)?
dados.02: "na: no idempotency keys; POST on a collection creates a new id on every call"   # Idempotent creations (double click, retry) and idempotency keys?
dados.03: "na: project + versoes/v1 creation uses 2 frontend calls, not transactional"   # Are operations that change multiple entities atomic (transaction)? What if one fails midway?
dados.04: "sim P05"   # Dates stored in UTC and displayed in the user's timezone? Day-only dates vs. instant?
dados.05: "sim PRJ-R09, MID-R04"   # Logical deletion: effect on uniqueness, listings, relations and restore?
dados.06: "sim P06"   # Migrations and backfill: order, reversal and existing data?
dados.07: "na: no backup/retention policy; local SQLite in DATA_DIR"   # Retention, backup and restore?
dados.08: "sim PLA-R02"   # Identifiers (uuid/sequential) and what is exposed to the client?
dados.09: "sim CON-R03, P07"   # Integrity: foreign keys, cascade and uniqueness constraints?

# --- pack ui: app with a user interface
ui.01: "sim RAD-R05, PUB-R06"   # Do all screens have loading, empty, error and success states?
ui.02: "sim CON-R02, PRJ-R01, RAD-R01, MID-R06, PUB-R01"   # Form validation: when it happens and per-field messages?
ui.03: "na: physical deletions without a verified confirmation dialog (UX gap)"   # Do destructive actions require confirmation and allow undo when possible?
ui.04: "sim PRJ-R02"   # Is double click/resubmit blocked during the request?
ui.05: "sim NAV-R01, NAV-R02, NAV-R06"   # Protected routes, post-login redirect and 404 page?
ui.06: "na: no formal a11y/mobile requirement; desktop-first usage (P02)"   # Responsiveness (mobile) and basic accessibility (keyboard, contrast, labels)?
ui.07: "sim P08"   # Language and formats (pt-BR, date, currency); is i18n planned?
ui.08: "na: no draft preservation when the session expires"   # Session expires mid-action: what happens to what the user typed?

# --- pack integracoes: APIs, webhooks or external services
integracoes.01: "sim P04, TRN-R04, REN-R07"   # Which external systems and what is each one used for?
integracoes.02: "sim P04"   # Authentication, usage limits and credential rotation?
integracoes.03: "sim NF02, NF04, REN-R10"   # Timeout, retry with backoff and idempotency on calls?
integracoes.04: "sim REN-R03"   # Behavior when the external service is down (fallback/degradation)?
integracoes.05: "na: no inbound webhooks"   # Inbound webhooks: signature, ordering and event duplication?
integracoes.06: "na: no outbound webhooks"   # Outbound webhooks: retries, permanent failures and user visibility?
integracoes.07: "sim P09"   # Sandbox/mocks for development and testing?
integracoes.08: "na: gemini-2.5-flash model hardcoded; RSS/Atom are stable formats"   # Third-party version and contract changes?

# --- pack arquivos: upload, download or file generation
arquivos.01: "sim TRN-R03, MID-R02"   # Accepted types, extensions and maximum size?
arquivos.02: "sim TRN-R02, MID-R03"   # Where are they stored and how is access protected (signed URL, permission)?
arquivos.03: "na: no real content validation or antivirus; content_type is declarative"   # Validation of actual content (not just extension) and malware scanning?
arquivos.04: "sim REN-R04, REN-R05, NF04"   # Async processing (thumbnails, OCR, conversion): states and failures?
arquivos.05: "sim TRN-R03"   # Per-user/plan limits and what happens when exceeded?
arquivos.06: "sim MID-R04"   # Removal: orphaned files and when the record is deleted?
arquivos.07: "sim MID-R02"   # Name, collision and special characters?

# --- pack listagens: screens or endpoints that list, search or filter data
listagens.01: "sim PLA-R11"   # Pagination (cursor or page), default and maximum size?
listagens.02: "sim PLA-R11"   # Stable default ordering and which fields are sortable?
listagens.03: "sim PLA-R11, RAD-R08, PES-R03"   # Available filters and how they combine?
listagens.04: "sim RAD-R08, PES-R03, PES-R04"   # Text search: fields, accents, upper/lowercase, minimum characters?
listagens.05: "sim PUB-R06, RAD-R05"   # Empty state and no-search-results state?
listagens.06: "na: no CSV/PDF export"   # Export (CSV/PDF): limits and permissions?
listagens.07: "sim P10"   # Performance at high volume (indexes, limits)?

# --- pack operacao: app going to production
operacao.01: "na: simple console logs in render-service, no structured request id"   # Structured logs with request id and defined levels?
operacao.02: "na: no /health endpoint or metrics"   # Metrics, alerts and health check?
operacao.03: "na: render is synchronous via HTTP with 600s timeout (REN-R10), no queue"   # Scheduled jobs/queues: retry, dead-letter, idempotency and concurrency?
operacao.04: "sim NF01, P06"   # Deploy and rollback: how migrations run and what is the strategy?
operacao.05: "sim P09"   # Environments (dev/staging/prod) and test/seed data?
operacao.06: "sim NF03, NF04, REN-R10"   # Resource limits and behavior under load?
operacao.07: "sim PLA-R05"   # Error tracking and who is notified?

# --- pack lgpd: personal data of people in Brazil
lgpd.01: "sim P03"   # Which personal data is collected and for what purpose (inventory)?
lgpd.02: "na: signup closed by default; basis is service execution by the data subject themself"   # Legal basis or consent: how is it requested and recorded?
lgpd.03: "na: no export endpoint; the subject accesses their data through the APIs themselves"   # Can the subject access/export their data?
lgpd.04: "sim PLA-R04, MID-R04, PRJ-R09"   # Can the subject correct and delete/anonymize their data? Effects on linked records?
lgpd.05: "na: no retention policy; data persists until manual deletion"   # Retention period per data type?
lgpd.06: "sim P04"   # Sharing with third parties/processors and where is the data stored?
lgpd.07: "na: minimal logs with no personal data by design (P03)"   # Logs and analytics without unnecessary personal data?
lgpd.08: "na: app is not aimed at minors (P03)"   # Minors: does the audience include them? Consent rules?
lgpd.09: "na: individual use; the subject is the instance operator themself (P02)"   # Subject channel and security incident procedure?

# --- pack auditoria: sensitive, administrative or financial actions
auditoria.01: "na: audit_events table exists but only the seed writes; no endpoint (P01)"   # Which actions are recorded (who, what, when, before/after)?
auditoria.02: "na: no query endpoint implemented; frontend calls /api/v1/admin/audit (P01)"   # Is the record immutable and who can query it?
auditoria.03: "na: no retention/export policy implemented"   # History retention and export?
auditoria.04: "na: no request id for correlation"   # Correlation between audit record and request/trace id?

