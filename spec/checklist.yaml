dados.02: "na: sem chaves de idempotência; POST em coleção cria id novo a cada chamada"   # Criações idempotentes (duplo clique, retry) e chaves de idempotência?
dados.03: "na: criação de projeto + versoes/v1 usa 2 chamadas do front, não transacional"   # Operações que alteram várias entidades são atômicas (transação)? E se falhar no meio?
dados.04: "sim P05"   # Datas guardadas em UTC e exibidas no fuso do usuário? Datas só de dia vs. instante?
dados.05: "sim PRJ-R09, MID-R04"   # Exclusão lógica: efeito em unicidade, listagens, relações e restauração?
dados.06: "sim P06"   # Migrações e backfill: ordem, reversão e dados existentes?
dados.07: "na: sem política de backup/retenção; SQLite local em DATA_DIR"   # Retenção, backup e restauração?
dados.08: "sim PLA-R02"   # Identificadores (uuid/sequencial) e o que é exposto ao cliente?
dados.09: "sim CON-R03, P07"   # Integridade: chaves estrangeiras, cascata e restrições de unicidade?

