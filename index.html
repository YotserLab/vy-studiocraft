<!doctype html>
<html lang="pt-BR" data-tema="claro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VYStudioCraft — Estúdio de Gestão e Produção YouTube</title>
    <meta
      name="description"
      content="Sistema de gestão e produção de canais YouTube: Radar de nichos, projetos Kanban, Roteirista IA, comparador de 30s, notícias RSS, biblioteca de mídia e publicidade."
    />
    <meta property="og:title" content="VYStudioCraft — Estúdio de Gestão e Produção YouTube" />
    <meta
      property="og:description"
      content="Sistema de gestão e produção de canais YouTube: Radar de nichos, projetos Kanban, Roteirista IA, comparador de 30s, notícias RSS, biblioteca de mídia e publicidade."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('vysc_tema') || 'claro';
          var valid = ['claro', 'azul', 'escuro', 'roxo', 'tecnologico', 'youtube'];
          if (valid.indexOf(t) === -1) t = 'claro';
          document.documentElement.setAttribute('data-tema', t);
          if (t !== 'claro') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
